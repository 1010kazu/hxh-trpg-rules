name: Validate rulebook

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate Markdown and sample calculations
        run: python3 scripts/validate.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install reading site dependency
        run: python3 -m pip install -r web/requirements.txt
      - name: Test reading site and publication scope
        run: python3 -m unittest discover -s tests/site -v
      - name: Build and verify reading site
        run: python3 scripts/build_site.py --output "${{ runner.temp }}/rulebook-site"
