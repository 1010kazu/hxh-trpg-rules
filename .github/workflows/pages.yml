name: Publish reading site

on:
  push:
    branches: [main]
  workflow_dispatch:

# 公開運用：Repository variable PAGES_ENABLED=true でmain更新を配信する。
# 公開範囲はweb/site.jsonに明示したページのみ。
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate rulebook
        run: python3 scripts/validate.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install site dependency
        run: python3 -m pip install -r web/requirements.txt
      - name: Test site publication scope
        run: python3 -m unittest discover -s tests/site -v
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static site
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
